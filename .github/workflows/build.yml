name: Build XPI

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build XPI file
        run: |
          zip -r CardViewQOL.xpi * -x "*.git*" "*.github*" "*.xpi" "README.md"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardViewQOL-build
          path: CardViewQOL.xpi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: CardViewQOL-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CardViewQOL.xpi
